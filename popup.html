<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="popup.pageTitle">Bible Quotes</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Favorites modal styles (lightweight, popup-only) */
    .favorites-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .favorites-modal {
      width: 320px;
      max-height: 70vh;
      overflow: auto;
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      font-family: inherit;
    }
    .favorites-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .favorites-header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .favorites-list { list-style: none; padding: 0; margin: 0; }
    .favorites-item { padding: 8px; border-bottom: 1px solid #eee; display:flex; gap:8px; align-items:flex-start }
    .favorites-text { flex: 1; font-size: 13px; color: #222 }
    .favorites-actions { display:flex; gap:6px }
    .btn-small { padding:6px 8px; border-radius:8px; border:none; cursor:pointer }

    .quote-of-day {
      margin: 8px 0 12px;
      padding: 10px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f5f7ff 0%, #eef2ff 100%);
      border: 1px solid rgba(102,126,234,0.25);
    }

    .quote-of-day-title {
      font-size: 12px;
      font-weight: 700;
      color: #4c5fd4;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .quote-of-day-text {
      font-size: 13px;
      color: #2d3748;
      line-height: 1.45;
      margin-bottom: 6px;
    }

    .quote-of-day-reference {
      font-size: 12px;
      font-weight: 600;
      color: #667eea;
      text-align: right;
    }

    .search-controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .search-controls input,
    .search-controls select {
      border: 1px solid #dbe1ff;
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
    }

    .search-results {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 260px;
      overflow: auto;
    }

    .search-item {
      border-bottom: 1px solid #edf0ff;
      padding: 8px 4px;
    }

    .search-item-actions {
      margin-top: 6px;
      display: flex;
      justify-content: flex-end;
    }

    .search-empty {
      font-size: 12px;
      color: #718096;
      text-align: center;
      padding: 12px 6px;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <!-- Header Section -->
    <header class="header">
      <h1 data-i18n="popup.title">📖 Bible Quotes</h1>
      <p data-i18n="popup.subtitle">Daily inspiration from scripture</p>
    </header>

    <!-- Loading State -->
    <div id="loading" class="loading" style="display: none;">
      <div class="loading-spinner"></div>
      <span data-i18n="popup.loading">Loading quotes...</span>
    </div>

    <!-- Error State -->
    <div id="error" class="error" style="display: none;">
      <p data-i18n="popup.errorLoadQuotes">Could not load quotes. Please try again.</p>
    </div>

    <!-- Success Message -->
    <div id="success" class="success" style="display: none;">
      <p data-i18n="popup.notificationSettingsSaved">Settings saved successfully!</p>
    </div>

    <!-- Quote Display Section -->
    <main class="quote-container">
      <section id="quoteOfDay" class="quote-of-day" style="display:none;">
        <div class="quote-of-day-title" data-i18n="popup.quoteOfDayTitle">Quote of the Day</div>
        <div id="quoteOfDayText" class="quote-of-day-text"></div>
        <div id="quoteOfDayReference" class="quote-of-day-reference"></div>
      </section>
      <div id="quote"></div>
    </main>

    <!-- Controls Section -->
    <section class="controls">
      <div class="control-group">
        <label for="quoteCount" class="control-label" data-i18n="popup.quoteCountLabel">Number of quotes to display:</label>
        <select id="quoteCount" aria-label="Select number of quotes" data-i18n-attr="aria-label" data-i18n="popup.quoteCountLabel">
          <option value="1" data-i18n="popup.option1">1 quote</option>
          <option value="2" data-i18n="popup.option2">2 quotes</option>
          <option value="3" data-i18n="popup.option3">3 quotes</option>
        </select>
      </div>

      <div class="control-group">
        <label for="quoteLanguage" class="control-label" data-i18n="popup.quoteLanguageLabel">Quote language:</label>
        <select id="quoteLanguage" aria-label="Select quote language" data-i18n-attr="aria-label" data-i18n="popup.quoteLanguageLabel">
          <option value="en" data-i18n="popup.languageEnglish">English</option>
          <option value="es" data-i18n="popup.languageSpanish">Spanish</option>
        </select>
      </div>

      <div class="control-group">
        <div class="checkbox-wrapper">
          <input type="checkbox" id="enableQuotes" aria-label="Enable quotes on Google searches" data-i18n="popup.enableQuotesLabel" data-i18n-attr="aria-label">
          <label for="enableQuotes" class="control-label" data-i18n="popup.enableQuotesLabel">Show quotes on Google searches</label>
        </div>
      </div>

      <div class="control-group">
        <div class="checkbox-wrapper">
          <input type="checkbox" id="enableFavorites" aria-label="Enable favorites feature" data-i18n="popup.enableFavoritesLabel" data-i18n-attr="aria-label">
          <label for="enableFavorites" class="control-label" data-i18n="popup.enableFavoritesLabel">Enable favorites feature</label>
        </div>
      </div>
    </section>

    <!-- Action Buttons -->
    <section class="actions">
      <button id="newQuoteBtn" class="btn" data-i18n-attr="aria-label" data-i18n="popup.newQuote">
        🔄 New Quote
      </button>
      <button id="favoritesBtn" class="btn btn-secondary" data-i18n-attr="aria-label" data-i18n="popup.favorites">
        ⭐ Favorites
      </button>
      
      <button id="shareBtn" class="btn btn-secondary" data-i18n-attr="aria-label" data-i18n="popup.shareQuote">
        📤 Share Quote
      </button>

      <button id="searchQuotesBtn" class="btn btn-secondary" data-i18n="popup.searchQuotes">
        🔍 Search Quotes
      </button>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p data-i18n="popup.version">Version 3.0.0</p>
    </footer>
  </div>

    <!-- Favorites Modal (hidden by default) -->
    <div id="favoritesModal" class="favorites-modal-backdrop" style="display:none;">
      <div class="favorites-modal" role="dialog" aria-modal="true">
        <div class="favorites-header">
          <strong data-i18n="popup.yourFavorites">Your Favorites</strong>
          <div class="favorites-header-actions">
            <button id="addCurrentToFavoritesBtn" class="btn-small" data-i18n="popup.addCurrentQuote">Add Current Quote</button>
            <button id="favoritesCloseBtn" class="btn-small" data-i18n="popup.close">Close</button>
          </div>
        </div>
        <ul id="favoritesList" class="favorites-list"></ul>
        <div style="margin-top:8px;text-align:right;"><button id="favoritesClearBtn" class="btn-small" data-i18n="popup.favoritesClearAll">Clear All</button></div>
      </div>
    </div>

    <!-- Search Modal -->
    <div id="searchModal" class="favorites-modal-backdrop" style="display:none;">
      <div class="favorites-modal" role="dialog" aria-modal="true">
        <div class="favorites-header">
          <strong data-i18n="popup.searchQuotes">Search Quotes</strong>
          <button id="searchCloseBtn" class="btn-small" data-i18n="popup.close">Close</button>
        </div>

        <div class="search-controls">
          <input id="quoteSearchInput" type="text" placeholder="Search text or verse" data-i18n="popup.searchPlaceholder" data-i18n-attr="placeholder">
          <select id="bookFilterSelect"></select>
          <select id="themeFilterSelect"></select>
        </div>

        <ul id="searchResultsList" class="search-results"></ul>
      </div>
    </div>

  <!-- Scripts in correct dependency order -->
  <script src="constants.js"></script>
  <script src="utils.js"></script>
  <script src="storageHelper.js"></script>
  <script src="preferencesManager.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
